packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - sharp
  - prisma
  - "@prisma/engines"
  - "@prisma/client"
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  # Prisma 7 ainda não suporta MongoDB — a própria documentação manda usar a 6.19
  # até o suporte sair. Subir para a 7 antes disso quebra o `prisma generate`.
  prisma: ^6.19.3
  "@prisma/client": ^6.19.3
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  "@tailwindcss/postcss": ^4.3.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
